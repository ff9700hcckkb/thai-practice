<html lang="zh-TW">
<head>

    <meta charset="UTF-8">

    <title>泰難了</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --sub-text: #b0b0b0;
            --btn-inactive: #3a3a3a;
            --search-bg: #333;
            --search-border: #444;
            --nav-bg: #252525;
            --accent-color: #e67e22;
            --btn-active: #3498db;
            --link-color: #2ecc71;
            --danger-color: #e74c3c;
            --star-color: #f1c40f;
            --thai-size: 32px;
            --zh-size: 19.2px;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --sub-text: #7f8c8d;
            --btn-inactive: #e0e0e0;
            --search-bg: #ffffff;
            --search-border: #bdc3c7;
            --nav-bg: #ecf0f1;
        }


/* 當啟動藝術字體模式時，套用 Noto Sans Thai */
.card.art-font .thai,
.phonetic-card.art-font .p-char {
    font-family: 'Noto Sans Thai', sans-serif !important;
    font-weight: 700;
    letter-spacing: 0px;
}
/* 按鈕啟動時的顏色（跟測驗模式一樣用橘色） */
.quiz-toggle.art-active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
}
        
        body { 
    
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); color: var(--text-color);
            padding: 20px 15px 60px 15px; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 480px; display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .app-title { font-size: 1.4rem; font-weight: bold; color: var(--btn-active); letter-spacing: 1px; }
        .menu-toggle {
            background: var(--nav-bg); border: 1px solid var(--search-border);
            color: var(--text-color); font-size: 1.5rem; padding: 8px 12px;
            border-radius: 10px; cursor: pointer; z-index: 1001;
        }

        .control-area {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px;
        }
        .search-container { width: 100%; }
        #search-input {
            width: 100%; padding: 14px 18px; border-radius: 12px;
            border: 2px solid var(--search-border); background: var(--search-bg);
            color: var(--text-color); font-size: 1rem; box-sizing: border-box; outline: none;
        }
        
        .action-row {
            display: flex; align-items: center; width: 100%; gap: 8px;
        }
      /* 確保按鈕容器不換行，並平分空間或緊湊排列 */
.left-actions {
    display: flex;
    gap: 4px; 
    flex: 1; /* 佔滿剩餘空間 */
}

/* 統一所有控制按鈕的基礎樣式 */
.quiz-toggle, .refresh-btn {
    background: var(--btn-inactive); /* 統一底色 */
    color: var(--text-color);
    border: 1px solid var(--search-border);
    border-radius: 8px;
    padding: 8px 4px; 
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.2s;
    box-sizing: border-box;
}

/* 移除原本 .refresh-btn 可能存在的特殊背景色設定 */
#refresh-btn-main {
    background: var(--btn-inactive) !important; 
    flex: 0 0 auto; /* 讓更新按鈕維持適當寬度 */
    width: auto;
    padding: 8px 12px;
}

/* 當按鈕被啟動時（測驗ON、輪播ON、藝術ON）的顏色 */
.quiz-toggle.active, 
.quiz-toggle.art-active {
    background: var(--accent-color) !important;
    color: white !important;
    border-color: var(--accent-color);
}
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; padding: 24px; margin: 12px 0; width: 100%; max-width: 480px; 
            display: flex; align-items: center; justify-content: space-between; box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative; min-height: 120px; transition: transform 0.1s; cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card-content { flex-grow: 1; padding-right: 15px; }

        .quiz-mode .chinese { opacity: 0; transition: opacity 0.3s; }
        .card.revealed .chinese { opacity: 1; color: var(--accent-color); }

        .thai { 
            font-family: "Leelawadee UI", "Ayuthaya", "Thonburi", sans-serif;
            font-size: var(--thai-size); line-height: 1.6; margin-bottom: 10px; 
            font-weight: 700; letter-spacing: 0.5px; word-break: break-word; display: block;
        }
        .chinese { font-size: var(--zh-size); color: var(--sub-text); margin-top: 8px; word-break: break-word; }
        
        .card-action { 
            display: flex; flex-direction: column; align-items: flex-end; 
            justify-content: center; gap: 8px; min-width: 70px;
        }
        .btn-speak { 
    position: absolute; 
    bottom: 8px;        /* 稍微往右下角退，拉開與上方星號的距離 */
    right: 8px;         /* 同上 */
    border: none; 
    background: transparent; 
    color: var(--accent-color); 
    font-size: 1.8rem;  /* 圖示視覺變小，增加中間空白處 */
    padding: 15px;      /* 增加內距，確保小圖示依然有足夠的感應範圍 */
    cursor: pointer; 
    transition: all 0.2s; 
    z-index: 6; 
}
        .btn-speak.playing { transform: scale(1.3); color: var(--btn-active); filter: drop-shadow(0 0 5px var(--btn-active)); }

        .source-tag {
            font-size: 0.7rem; color: var(--sub-text);
            background: rgba(128, 128, 128, 0.1); padding: 2px 6px;
            border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.2);
            white-space: nowrap;
        }

       .btn-fav { 
    position: absolute; 
    top: 8px;           /* 往右上角退，遠離下方的喇叭 */
    right: 8px; 
    background: transparent; 
    border: none; 
    font-size: 1.4rem; 
    cursor: pointer; 
    color: #555; 
    transition: 0.2s; 
    padding: 12px;      /* 適中的感應範圍 */
    z-index: 5;
}
        .btn-fav.active { color: var(--star-color); text-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }

        .filter-btn {
            padding: 10px 16px;
            border: 2px solid var(--search-border);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 80px;
            flex: 1;
            max-width: 120px;
        }
        .filter-btn:hover {
            background: var(--nav-bg);
            border-color: var(--text-color);
        }
        .filter-btn.active {
            background: var(--text-color);
            color: var(--card-bg);
            border-color: var(--text-color);
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 0 10px;
        }
        .filter-container::-webkit-scrollbar {
            height: 4px;
        }
        .filter-container::-webkit-scrollbar-track {
            background: var(--nav-bg);
            border-radius: 2px;
        }
        .filter-container::-webkit-scrollbar-thumb {
            background: var(--search-border);
            border-radius: 2px;
        }
        .filter-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-color);
        }

        @media (max-width: 600px) {
            .filter-btn {
                min-width: 70px;
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .filter-container {
                gap: 6px;
                padding: 0 5px;
            }
        }

        .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: var(--bg-color); box-shadow: -5px 0 15px rgba(0,0,0,0.3); transition: 0.3s ease; z-index: 2000; padding: 25px; overflow-y: auto; box-sizing: border-box; }
        .sidebar.open { right: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1999; }
        .sidebar-section { margin-bottom: 25px; }
        .sidebar-label { color: var(--sub-text); font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; border-bottom: 1px solid var(--search-border); padding-bottom: 8px; }
        .grid-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .source-btn { padding: 14px 2px; border-radius: 10px; border: none; background: var(--btn-inactive); color: var(--sub-text); font-weight: 600; font-size: 1rem; cursor: pointer; }
        .source-btn.active, .side-full-btn.active { background: var(--btn-active) !important; color: white !important; }
        .side-full-btn { width: 100%; padding: 16px; border-radius: 10px; border: none; background: var(--nav-bg); color: var(--text-color); margin-bottom: 10px; text-align: left; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        
        .modal-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 3000; display: none; flex-direction: column; align-items: center; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .setting-group { background: var(--card-bg); padding: 15px 20px; border-radius: 15px; border: 1px solid var(--search-border); margin-bottom: 10px; }
        .info-text { font-size: 0.95rem; line-height: 1.6; color: var(--text-color); margin-bottom: 5px; }
        .desc-text { font-size: 0.8rem; color: var(--sub-text); margin-top: 5px; }
        .close-btn { background: var(--danger-color); color: white; padding: 16px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        #loading { margin-top: 50px; color: var(--sub-text); }
        #search-info { color: var(--sub-text); margin-bottom: 0; font-size: 0.85rem; text-align: right; }
        input[type="number"] { background: var(--search-bg); color: var(--text-color); border: 1px solid var(--search-border); font-size: 1rem; }

        /* 子音/母音 4欄格狀佈局 */
        #phonetic-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 520px;
            padding: 4px 0;
        }
        .phonetic-card {
            background: var(--card-bg);
            border: 1px solid var(--search-border);
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            min-height: 80px;
            -webkit-tap-highlight-color: transparent;
        }
        .phonetic-card:active {
            transform: scale(0.94);
            box-shadow: 0 0 0 2px var(--accent-color);
        }
        .phonetic-card .p-char {
            font-family: "Leelawadee UI", "Ayuthaya", "Thonburi", sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.2;
        }
        .phonetic-card .p-roman {
            font-size: 0.72rem;
            color: var(--sub-text);
            letter-spacing: 0.3px;
        }
        .phonetic-card.playing {
            box-shadow: 0 0 0 2px var(--accent-color);
            background: var(--btn-active);
        }
        .phonetic-card.playing .p-char,
        .phonetic-card.playing .p-roman {
            color: white;
        }

        /* 子音底色 */
        .phonetic-card.cat-中 { background: rgba(100,130,180, 0.13); border-color: rgba(100,130,180,0.3); }
        .phonetic-card.cat-高 { background: rgba(210,120, 50, 0.12); border-color: rgba(210,120, 50,0.3); }
        .phonetic-card.cat-低 { background: rgba( 60,160,100, 0.13); border-color: rgba( 60,160,100,0.3); }

        /* 母音底色 */
        .phonetic-card.cat-短母音   { background: rgba( 60,120,210, 0.12); border-color: rgba( 60,120,210,0.3); }
        .phonetic-card.cat-長母音   { background: rgba(130, 80,200, 0.12); border-color: rgba(130, 80,200,0.3); }
        .phonetic-card.cat-特殊母音 { background: rgba(210, 80, 70, 0.12); border-color: rgba(210, 80, 70,0.3); }
        .phonetic-card.cat-複合母音 { background: rgba( 50,170,110, 0.13); border-color: rgba( 50,170,110,0.3); }

        /* ===== 影子跟讀模式 ===== */
        #shadow-mode-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 5000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #shadow-mode-overlay.active { display: flex; }

        .shadow-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--search-border);
        }
        .shadow-title { font-size: 0.9rem; color: var(--sub-text); font-weight: bold; }
        .shadow-close {
            background: none; border: none; color: var(--sub-text);
            font-size: 1.5rem; cursor: pointer; padding: 4px 8px;
        }
        .shadow-progress {
            font-size: 0.85rem; color: var(--sub-text);
        }

        /* 主卡片區 */
        .shadow-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin-top: 70px;
            margin-bottom: 12px;
            gap: 12px;
            overflow: hidden;
        }
        .shadow-thai {
            font-family: "Leelawadee UI", "Ayuthaya", "Thonburi", sans-serif;
            font-size: clamp(1.4rem, 5vw, 2.8rem);
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 1px;
            color: var(--text-color);
            transition: opacity 0.3s;
            width: 100%;
            overflow-y: auto;
            max-height: 120px;
            padding: 0 4px;
        }
        .shadow-chinese {
            font-size: 1.1rem;
            color: var(--sub-text);
            min-height: 1.6em;
            transition: opacity 0.3s;
        }
        .shadow-chinese.hidden { opacity: 0; }

        /* 狀態提示 */
        .shadow-status {
            font-size: 0.9rem;
            color: var(--accent-color);
            min-height: 1.4em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* 波形動畫（播放中） */
        .shadow-wave {
            display: none;
            gap: 4px;
            align-items: flex-end;
            height: 24px;
        }
        .shadow-wave.active { display: flex; }
        .shadow-wave span {
            width: 4px;
            background: var(--accent-color);
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }
        .shadow-wave span:nth-child(2) { animation-delay: 0.1s; }
        .shadow-wave span:nth-child(3) { animation-delay: 0.2s; }
        .shadow-wave span:nth-child(4) { animation-delay: 0.3s; }
        .shadow-wave span:nth-child(5) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { height: 6px; }
            50% { height: 20px; }
        }

        /* 底部控制列 */
        .shadow-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }
        .shadow-btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .shadow-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--search-border);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
        }
        .shadow-btn:active { opacity: 0.7; transform: scale(0.97); }
        .shadow-btn.primary {
            background: var(--btn-active);
            color: white;
            border-color: var(--btn-active);
            font-size: 1rem;
        }
        .shadow-btn.accent {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 速度＆間隔設定列 */
        .shadow-settings {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--sub-text);
        }
        .shadow-settings select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--search-border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
    </style>
</head>

 <div id="about-page" class="modal-page">

async function initAllData() {
    try {
        // 1. 準備抓取詞庫的 Promises
        const fetchPromises = Object.keys(gids).map(async (key) => {
            const response = await fetch(`${base_url}&gid=${gids[key].id}&t=${Date.now()}`);
            const csvText = await response.text();
            const rows = csvText.split(/\r?\n/).slice(1);
            return rows.map(row => {
                const cols = row.split(',');
                let t = (cols.length > 2 ? cols[1] : cols[0])?.trim();
                let c = (cols.length > 2 ? cols[2] : cols[1])?.trim();
                return { id: btoa(unescape(encodeURIComponent(t))), thai: t, chinese: c, source: gids[key].name };
            }).filter(item => item.thai);
        });

        // 2. 準備抓取「關於本站」的 Promise
        const fetchAboutPromise = (async () => {
            const response = await fetch(`${base_url}&gid=${ABOUT_GID}&t=${Date.now()}`);
            const csvText = await response.text();
            const allRows = parseCSVMultiline(csvText).slice(1); // 跳過標題行，正確處理多行內容
            return allRows.map(cols => {
                const title = cols[0]?.replace(/"/g, '').trim();
                let content = cols[1]?.replace(/"/g, '').trim() || '';
                // 把真實換行（Alt+Enter）轉成 <br>，也兼容舊的 \n 寫法
                content = content.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                return { title, content };
            }).filter(item => item.title);
        })();

        // 3. 同時啟動所有抓取任務
        const [詞庫結果, 關於結果] = await Promise.all([
            Promise.all(fetchPromises),
            fetchAboutPromise
        ]);

        // 4. 分配資料
        allData = 詞庫結果.flat();
        aboutData = 關於結果;

        // 5. 隱藏載入中並初始化頁面
        document.getElementById('loading').style.display = 'none';
        displayRandom();
        refreshSiteStats();
        initExternalLinks(); 
        
    } catch (e) { 
        console.error(e);
        document.getElementById('loading').innerText = '資料同步失敗'; 
    }
}

// 1. 開啟短文清單頁
// 全域 CSV 解析器，正確處理欄位內換行（Alt+Enter）與引號
function parseCSVMultiline(text) {
    const rows = [];
    let col = '', cols = [], inQuote = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
            if (inQuote && text[i+1] === '"') { col += '"'; i++; }
            else inQuote = !inQuote;
        } else if (ch === ',' && !inQuote) {
            cols.push(col); col = '';
        } else if ((ch === '\n' || (ch === '\r' && text[i+1] === '\n')) && !inQuote) {
            if (ch === '\r') i++;
            cols.push(col); col = '';
            rows.push(cols); cols = [];
        } else {
            col += ch;
        }
    }
    if (col || cols.length) { cols.push(col); rows.push(cols); }
    return rows;
}

function convertNumbersToThaiText(text) {
    if (!text) return "";

    // 檢查字串中是否包含任何 阿拉伯數字 (0-9) 或 泰文數字 (๐-๙)
    // 如果完全沒有數字，直接回傳原始文字，不做任何處理，確保泰文編碼完整
    if (!/[0-9๐-๙]/.test(text)) {
        return text;
    }

    const thaiNumbers = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    const units = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน'];

    // 先處理泰文數字轉阿拉伯數字
    let processed = text.replace(/[๐-๙]/g, d => "๐๑๒๓๔๕๖๗๘๙".indexOf(d));

    // 執行數字轉泰文文字
    return processed.replace(/\d+/g, (match) => {
        let n = parseInt(match);
        if (n === 0) return thaiNumbers[0];
        
        let str = '';
        let numStr = match;
        let len = numStr.length;

        for (let i = 0; i < len; i++) {
            let digit = parseInt(numStr[i]);
            let position = (len - i - 1) % 6;
            
            if (digit !== 0) {
                if (position === 0 && digit === 1 && len > 1) {
                    str += 'เอ็ด';
                } else if (position === 1 && digit === 2) {
                    str += 'ยี่สิบ';
                } else if (position === 1 && digit === 1) {
                    str += 'สิบ';
                } else {
                    str += thaiNumbers[digit] + units[position];
                }
            }
            if (i < len - 1 && (len - i - 1) % 6 === 0) {
                str += 'ล้าน';
            }
        }
        return str;
    });
}

  // 修改後的輪播播放函式
        function speakPromise(text) {
            return new Promise((resolve) => {
                window.speechSynthesis.cancel();
                
                let processedText = text.normalize('NFC').trim();
                processedText = processedText.replace(/\u0e4d\u0e32/g, "\u0e33");
                processedText = processedText.replace(/จำนวน/g, "จัม-นวน");
                processedText = convertNumbersToThaiText(processedText);
                processedText = processedText.replace(/น[\u0e33\u0e4d\u0e32\u0e49]{2,3}/g, "นั้ม");
                processedText = processedText.replace(/([\u0e01-\u0e39\u0e40-\u0e4e])([\u0e48-\u0e4b])?([\u0e33\u0e4d])(\u0e32?)/g, (match, con, tone, am, a) => {
                    let finalTone = tone ? tone : "";
                    return con + "\u0e31" + finalTone + "\u0e21";
                });
                processedText = processedText.replace(/([\u0e00-\u0e7f]+)ๆ/g, '$1 $1');
                
                const msg = new SpeechSynthesisUtterance(processedText);
                const voices = window.speechSynthesis.getVoices();
                const bestVoice = voices.find(v => v.lang.includes('th') && (v.name.includes('Siri') || v.name.includes('Enhanced')))
                                || voices.find(v => v.lang.includes('th'));
                if (bestVoice) msg.voice = bestVoice;
                msg.lang = 'th-TH';
                msg.rate = currentSpeed;
                msg.onend = () => resolve();
                msg.onerror = () => resolve();
                window.speechSynthesis.speak(msg);
            });
        }

function speak(text, btnElement, e) {
    if(e) e.stopPropagation();
    window.speechSynthesis.cancel();

    let processedText = text.normalize('NFC').trim();
    
    // 處理泰文發音
    processedText = processedText.replace(/\u0e4d\u0e32/g, "\u0e33");
    processedText = processedText.replace(/จำนวน/g, "จัม-นวน");
    processedText = convertNumbersToThaiText(processedText);
    processedText = processedText.replace(/น[\u0e33\u0e4d\u0e32\u0e49]{2,3}/g, "นั้ม");
    processedText = processedText.replace(/([ก-๙])([\u0e48-\u0e4b])?([\u0e33\u0e4d])(\u0e32?)/g, (match, con, tone, am, a) => {
        let finalTone = tone ? tone : "";
        return con + "ั" + finalTone + "ม";
    });
    // ๆ 處理：有空格則重複最後一個詞，沒空格則整個詞重複
    processedText = processedText.replace(/([\u0e00-\u0e7f][\u0e00-\u0e7f\s]*?)\s*ๆ/g, (match, word) => {
        const trimmed = word.trim();
        const parts = trimmed.split(/\s+/);
        const repeat = parts[parts.length - 1];
        return trimmed + ' ' + repeat;
    });

    const msg = new SpeechSynthesisUtterance(processedText);
    const voices = window.speechSynthesis.getVoices();
    const bestVoice = voices.find(v => v.lang.includes('th') && (v.name.includes('Siri') || v.name.includes('Enhanced')))
                    || voices.find(v => v.lang.includes('th'));

    if (bestVoice) msg.voice = bestVoice;
    msg.lang = 'th-TH';
    msg.rate = currentSpeed; 

    if (btnElement) btnElement.classList.add('playing');
    msg.onend = () => { if (btnElement) btnElement.classList.remove('playing'); };
    
    window.speechSynthesis.speak(msg);
}

async function lyricsPlay() {
    if (lyricsIsPlaying) {
        window.speechSynthesis.cancel();
        lyricsIsPlaying = false;
        const btn = document.getElementById('lyrics-play-btn');
        if (btn) btn.textContent = '▶ 播放';
        return;
    }
    const line = lyricsLines[lyricsIndex];
    if (!line) return;

    lyricsIsPlaying = true;
    const btn = document.getElementById('lyrics-play-btn');
    if (btn) btn.textContent = '⏸ 播放中';

    await shadowSpeak(line.thai.replace(/\*\*(.*?)\*\*/g, '$1'), lyricsSpeed);

    lyricsIsPlaying = false;
    if (btn) btn.textContent = '▶ 播放';

    if (lyricsIsAuto) {
        await new Promise(r => setTimeout(r, 800));
        if (lyricsIsAuto && lyricsIndex < lyricsLines.length - 1) {
            lyricsIndex++;
            lyricsUpdateHighlight();
            lyricsPlay();
        } else if (lyricsIndex >= lyricsLines.length - 1) {
            lyricsIsAuto = false;
            const autoBtn = document.getElementById('lyrics-auto-btn');
            if (autoBtn) { autoBtn.style.background = 'var(--btn-inactive)'; autoBtn.textContent = '🔁 自動'; }
        }
    }

        btn.textContent = lyricsIsAuto ? '🔁 自動中' : '🔁 自動';

        const voices = window.speechSynthesis.getVoices();
        const best = voices.find(v => v.lang.includes('th') && (v.name.includes('Siri') || v.name.includes('Enhanced')))
                  || voices.find(v => v.lang.includes('th'));
        if (best) msg.voice = best;
        msg.lang = 'th-TH';
        msg.rate = speed;
        msg.onend = resolve;
        msg.onerror = resolve;
        window.speechSynthesis.speak(msg);
    });
}

function shadowPlayAudio(url) {
    return new Promise(resolve => {
        const audio = new Audio(url);
        audio.onended = resolve;
        audio.onerror = resolve;
        audio.play().catch(resolve);
    });
}

function shadowNext() {
    window.speechSynthesis.cancel();
    shadowIsPlaying = false;
    if (shadowIndex < shadowList.length - 1) {
        shadowIndex++;
        shadowRender();
        document.getElementById('shadow-play-btn').textContent = '▶ 播放';
        if (shadowIsEssayMode) {
            const sentences = shadowList.map(s => s.thai);
            shadowUpdateEssayContext(sentences);
        }
        if (shadowIsAuto) shadowPlayCurrent();
    } else {
        shadowStopAuto();
        shadowSetStatus('🎉 全部完成！');
        document.getElementById('shadow-play-btn').textContent = '▶ 播放';
    }
}

function shadowPrev() {
    window.speechSynthesis.cancel();
    shadowIsPlaying = false;
    shadowStopAuto();
    if (shadowIndex > 0) {
        shadowIndex--;
        shadowRender();
        document.getElementById('shadow-play-btn').textContent = '▶ 播放';
        if (shadowIsEssayMode) {
            const sentences = shadowList.map(s => s.thai);
            shadowUpdateEssayContext(sentences);
        }
    }
}

function shadowToggleReveal() {
    shadowRevealed = !shadowRevealed;
    document.getElementById('shadow-chinese').classList.toggle('hidden', !shadowRevealed);
    document.getElementById('shadow-reveal-btn').textContent = shadowRevealed ? '🙈 隱藏中文' : '👁 顯示中文';
}

function shadowToggleAuto() {
    shadowIsAuto = !shadowIsAuto;
    const btn = document.getElementById('shadow-auto-btn');
    if (shadowIsAuto) {
        btn.textContent = '⏹ 停止自動';
        btn.style.background = 'var(--danger-color)';
        if (!shadowIsPlaying) shadowPlayCurrent();
    } else {
        shadowStopAuto();
    }
}

function shadowStopAuto() {
    shadowIsAuto = false;
    const btn = document.getElementById('shadow-auto-btn');
    btn.textContent = '⏩ 自動輪播';
    btn.style.background = 'var(--accent-color)';
}

// ===== END 影子跟讀 =====

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

<!-- 影子跟讀模式 -->
<div id="shadow-mode-overlay">
    <div class="shadow-header">
        <div class="shadow-title">🎙️ 影子跟讀</div>
        <div class="shadow-progress" id="shadow-progress">0 / 0</div>
        <button class="shadow-close" onclick="closeShadowMode()">✕</button>
    </div>

    <div class="shadow-card">
        <div class="shadow-wave" id="shadow-wave">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="shadow-status" id="shadow-status">準備開始</div>
        <div class="shadow-thai" id="shadow-thai">—</div>
        <div class="shadow-chinese hidden" id="shadow-chinese">—</div>
        <!-- 短文模式：顯示全文段落，當前句高亮 -->
        <div id="shadow-essay-context" style="display:none; width:100%; max-width:480px; margin-top:12px; padding:14px 16px; background:var(--card-bg); border-radius:12px; border:1px solid var(--search-border); font-size:1.1rem; line-height:2; color:var(--sub-text); text-align:left; font-family:'Leelawadee UI','Ayuthaya','Thonburi',sans-serif; max-height:160px; overflow-y:auto;"></div>
    </div>

    <div class="shadow-controls">
        <!-- 設定列 -->
        <div class="shadow-settings">
            <span>語速</span>
            <select id="shadow-speed">
                <option value="0.6">慢 0.6x</option>
                <option value="0.8">稍慢 0.8x</option>
                <option value="1.0" selected>正常 1x</option>
                <option value="1.2">稍快 1.2x</option>
            </select>
            <span>跟讀間隔</span>
            <select id="shadow-gap">
                <option value="1500">1.5 秒</option>
                <option value="2000" selected>2 秒</option>
                <option value="3000">3 秒</option>
                <option value="4000">4 秒</option>
            </select>
        </div>
        <!-- 主控制按鈕 -->
        <div class="shadow-btn-row">
            <button class="shadow-btn" onclick="shadowPrev()">← 上一個</button>
            <button class="shadow-btn primary" id="shadow-play-btn" onclick="shadowPlayCurrent()">▶ 播放</button>
            <button class="shadow-btn" onclick="shadowNext()">下一個 →</button>
        </div>
        <!-- 輔助按鈕 -->
        <div class="shadow-btn-row">
            <button class="shadow-btn" id="shadow-reveal-btn" onclick="shadowToggleReveal()">👁 顯示中文</button>
            <button class="shadow-btn accent" id="shadow-auto-btn" onclick="shadowToggleAuto()">⏩ 自動輪播</button>
        </div>
    </div>
</div>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" style="position:fixed; bottom:20px; right:20px; width:45px; height:45px; border-radius:50%; background:var(--btn-active); color:white; border:none; display:none; z-index:99; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3);">↑</button>
</body>
</html>
